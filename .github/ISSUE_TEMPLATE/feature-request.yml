name: ✨ Feature Request
description: Suggest a new feature or enhancement for MAKON
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe it in detail.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing feature requests
          required: true
        - label: This feature is not already in the roadmap
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - 🎨 UI/UX improvement
        - 🏗 New module/page
        - 🔧 Enhancement to existing feature
        - 🔌 Integration
        - 📊 Analytics/Reporting
        - ⚡ Performance
        - 🌐 Localization
        - 🔒 Security
        - 📱 Mobile/PWA
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Public (Landing/Catalog/Building)
        - Auth (Login/ERI)
        - Dashboard
        - Management (Buildings/Units/Listings)
        - Finance (Invoices/Debts/Inventory)
        - Facility (Work Orders)
        - Cabinet (Tenant)
        - Admin (Users/Roles/Settings)
        - Reports
        - Notifications
        - Global/New module
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions you've considered.

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Links to inspiration, screenshots, or design references.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔴 Critical — blocks a use case
        - 🟡 Important — significant improvement
        - 🟢 Nice to have
    validations:
      required: true
